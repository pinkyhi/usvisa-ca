[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "usvisa-ca"
dynamic = ["version"]
description = "US visa appointment monitoring node and coordinator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["python-dotenv"]

[project.optional-dependencies]
node = [
    "requests",
    "selenium",
    "webdriver-manager",
    "beautifulsoup4",
]
coordinated = ["websocket-client>=1.8,<2"]
coordinator = [
    "aio-pika>=9,<10",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "argon2-cffi>=23,<26",
    "httpx>=0.27,<1",
]

[project.scripts]
usvisa-node = "usvisa.node.app:main"
usvisa-coordinator = "usvisa.coordinator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "usvisa.__version__"}

[tool.setuptools.package-data]
"usvisa.coordinator" = ["templates/*.html", "static/*"]
