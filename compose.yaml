name: usvisa
services:
  node:
    build:
      context: .
      dockerfile: infra/node.Dockerfile
    env_file:
      - path: ${NODE_ENV_FILE:-.env}
        required: false
    environment:
      MODE: ${MODE:-solo}
      EXPOSE_MODE: ${EXPOSE_MODE:-cloudflare_quick}
      QUICK_TUNNEL_METRICS: ${QUICK_TUNNEL_METRICS-http://quick:20241/quicktunnel}
      USVISA_DATA_DIR: /data
      SHOW_GUI: "false"
      USVISA_CONTAINER: "true"
    volumes:
      - node:/data
      - ./.sessions:/data/.sessions
      - ./.booking-state:/data/.booking-state
      - ./.node-state:/data/.node-state
      - ./logs:/data/logs
    shm_size: 512mb
    init: true
    # Solo success or terminal ambiguity must stay stopped.
    # Coordinated success disables booking and keeps monitoring in this process.
    restart: "no"
    stop_grace_period: 30s
  rabbitmq:
    profiles: [coordinated]
    build: ./infra/rabbitmq
    env_file:
      - path: ${SERVER_ENV_FILE:-.server.env}
        required: false
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  coordinator:
    profiles: [coordinated]
    build:
      context: .
      dockerfile: infra/Dockerfile
    env_file:
      - path: ${SERVER_ENV_FILE:-.server.env}
        required: false
    environment:
      EXPOSE_MODE: ${EXPOSE_MODE:-cloudflare_quick}
      QUICK_TUNNEL_METRICS: http://quick:20241/quicktunnel
      BROKER_USER: coordinator
    depends_on:
      rabbitmq: {condition: service_healthy}
    volumes:
      - coordinator:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "usvisa.coordinator", "health"]
      interval: 5s
      timeout: 5s
      retries: 20
  edge:
    profiles: [coordinated]
    image: nginx:1.28-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${LOCAL_PORT:-8080}:8080"
    depends_on:
      coordinator: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/nginx.pid && nginx -t"]
      interval: 2s
      timeout: 5s
      retries: 15
  quick:
    image: cloudflare/cloudflared:latest
    profiles: [coordinated-cloudflare_quick]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://edge:8080
    depends_on: [edge]
    restart: unless-stopped
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [coordinated-cloudflare_domain]
    command: tunnel --no-autoupdate run
    env_file:
      - path: ${SERVER_ENV_FILE:-.server.env}
        required: false
    depends_on: [edge]
    restart: unless-stopped
volumes:
  node:
  rabbitmq:
  coordinator:
